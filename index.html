<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manhattan Weather</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #071a1f;
    --bg2: #0c2a32;
    --panel: rgba(8, 36, 42, 0.92);
    --line: rgba(120, 220, 200, 0.18);
    --text: #e7f7f2;
    --muted: #8fb3ad;
    --green: #3dffa8;
    --teal: #2ec4b6;
    --blue: #4da3ff;
    --warn: #f0c14d;
    --bad: #ff6b7a;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    --sky-top: #062028;
    --sky-mid: #071a1f;
    --sky-bot: #06151c;
    --glow-a: rgba(46, 196, 182, 0.22);
    --glow-b: rgba(77, 163, 255, 0.18);
    background:
      radial-gradient(900px 500px at 10% -10%, var(--glow-a), transparent 55%),
      radial-gradient(800px 460px at 100% 0%, var(--glow-b), transparent 52%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 42%, var(--sky-bot) 100%);
    background-attachment: fixed;
    transition: background 0.9s ease;
  }
  body.sky-rain::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--rain-opacity, 0.28);
    background: repeating-linear-gradient(
      -18deg,
      transparent 0 14px,
      rgba(210, 230, 255, 0.09) 14px 15px
    );
    animation: rain-fall 0.65s linear infinite;
  }
  body.sky-storm::after {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(700px 380px at 70% -10%, rgba(120, 90, 220, 0.18), transparent 60%);
    animation: storm-pulse 4.5s ease-in-out infinite;
  }
  @keyframes rain-fall {
    from { background-position: 0 0; }
    to { background-position: 16px 26px; }
  }
  @keyframes storm-pulse {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 0.9; }
  }
  .wrap { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 1.25rem 1rem 2.5rem; }
  header { margin-bottom: 0.85rem; }
  header h1 {
    margin: 0; font-size: 1.55rem; font-weight: 700;
    letter-spacing: -0.02em; color: var(--green);
  }
  header .sub { color: var(--muted); margin-top: 0.25rem; font-size: 0.95rem; }
  #liveBadge {
    display: inline-block; margin-left: 0.35rem;
    padding: 0.1rem 0.45rem; border-radius: 999px;
    font-size: 0.75rem; font-weight: 650;
    background: rgba(61,255,168,0.12); color: var(--green);
    vertical-align: 0.05rem;
  }
  #liveBadge.stale { background: rgba(240,193,77,0.15); color: var(--warn); }
  #liveBadge.err { background: rgba(255,107,122,0.15); color: var(--bad); }
  nav.tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.9rem 0 0.85rem; }
  nav.tabs button {
    appearance: none; border: 1px solid var(--line); background: var(--bg2);
    color: var(--muted); padding: 0.5rem 0.9rem; border-radius: 999px;
    font: inherit; font-size: 0.92rem; cursor: pointer;
  }
  nav.tabs button:hover { color: var(--text); border-color: var(--teal); }
  nav.tabs button.active {
    background: linear-gradient(135deg, #1a6b5c, #1a5f8a);
    color: #fff; border-color: transparent; font-weight: 600;
  }
  .panel {
    display: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 0.95rem;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }
  .panel.active { display: block; }
  .hint { color: var(--muted); margin: 0 0 0.85rem; font-size: 0.9rem; }
  .wx { display: flex; align-items: center; gap: 0.65rem; min-width: 0; }
  .wx { gap: 0.45rem; }
  .wx .emoji {
    width: 1.9rem; height: 1.9rem; display: grid; place-items: center;
    font-size: 1.2rem; line-height: 1;
    background: rgba(46, 196, 182, 0.12);
    border: 1px solid var(--line); border-radius: 8px; flex: 0 0 auto;
  }
  .wx .label { font-weight: 600; font-size: 0.95rem; line-height: 1.2; }
  .wx .detail { color: var(--muted); font-size: 0.78rem; line-height: 1.2; }
  /* keep rows tight: hide secondary condition line */
  .hour-card .wx .detail, .day-row .wx .detail { display: none; }
  .temp { font-weight: 700; font-variant-numeric: tabular-nums; color: #b8ffe0; font-size: 1rem; }
  .pill {
    display: inline-block; min-width: 2.4rem; text-align: center;
    background: rgba(77, 163, 255, 0.15); color: #9fd0ff;
    border-radius: 999px; padding: 0.05rem 0.4rem; font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
  }
  .day-group {
    color: var(--teal); font-size: 0.72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em;
    margin: 0.55rem 0 0.15rem; padding-bottom: 0.15rem;
    border-bottom: 1px solid var(--line);
  }
  .day-group:first-child { margin-top: 0; }
  .hour-list.desktop-table { display: none; }
  .hour-card {
    display: grid;
    grid-template-columns: 3.6rem minmax(0, 1fr) auto auto;
    gap: 0.35rem 0.65rem;
    align-items: center;
    padding: 0.45rem 0.1rem;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .hour-card .time {
    font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text);
  }
  .hour-card .submetrics {
    display: flex; flex-direction: column; align-items: flex-end; gap: 0.08rem;
    font-variant-numeric: tabular-nums; min-width: 3.6rem;
  }
  .hour-card .wind {
    color: var(--muted); font-size: 0.78rem; white-space: nowrap;
  }
  .hour-card .temp {
    font-size: 1.05rem; min-width: 2.6rem; text-align: right;
  }
  /* Desktop: classic table */
  table.hour-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  table.hour-table th {
    text-align: left; color: var(--teal); font-weight: 600; font-size: 0.78rem;
    text-transform: uppercase; letter-spacing: 0.04em;
    padding: 0.45rem 0.5rem; border-bottom: 1px solid var(--line);
  }
  table.hour-table td {
    padding: 0.5rem 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.06);
    vertical-align: middle;
  }
  table.hour-table tr:hover td { background: rgba(46, 196, 182, 0.06); }
  table.hour-table th:last-child,
  table.hour-table td.temp { text-align: right; }
  .day-row {
    display: grid;
    grid-template-columns: 7.5rem minmax(0, 1.35fr) 5rem 6.2rem minmax(8rem, 1fr);
    gap: 0.45rem 0.65rem;
    align-items: center;
    padding: 0.55rem 0.15rem;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .day-name { font-weight: 650; }
  .day-temps { display: flex; align-items: center; gap: 0.45rem; font-variant-numeric: tabular-nums; }
  .lo { color: var(--muted); width: 2.2rem; text-align: right; flex: 0 0 auto; }
  .hi { font-weight: 700; width: 2.2rem; color: #b8ffe0; flex: 0 0 auto; }
  .bar-track { flex: 1; height: 8px; background: #12343c; border-radius: 999px; position: relative; overflow: hidden; min-width: 2.5rem; }
  .bar-fill {
    position: absolute; top: 0; bottom: 0; border-radius: 999px;
    background: linear-gradient(90deg, var(--blue), var(--teal), var(--green));
  }
  .day-meta {
    display: none;
  }
  .day-wind { color: var(--muted); font-size: 0.88rem; text-align: right; }
  .day-rain { color: var(--muted); font-size: 0.88rem; }

  #radarMap {
    height: min(62vh, 560px); border-radius: 12px;
    border: 1px solid var(--line); background: #0a2028;
  }
  .radar-controls {
    display: flex; align-items: center; gap: 0.65rem; flex-wrap: wrap;
    margin-top: 0.65rem; color: var(--muted); font-size: 0.9rem;
  }
  .radar-controls .ts { font-variant-numeric: tabular-nums; }
  .radar-controls .ts.obs { color: var(--green); }
  .radar-controls .ts.fcst { color: #ffb070; }
  .radar-badge {
    font-size: 0.72rem; font-weight: 750; letter-spacing: 0.04em;
    text-transform: uppercase; padding: 0.18rem 0.5rem; border-radius: 999px;
  }
  .radar-badge.obs { background: rgba(61,255,168,0.15); color: var(--green); }
  .radar-badge.fcst { background: rgba(255,176,80,0.18); color: #ffb070; }
  #radarPlay {
    appearance: none; border: 1px solid var(--line); background: var(--bg2);
    color: var(--text); border-radius: 999px; padding: 0.28rem 0.7rem;
    font: inherit; font-size: 0.82rem; cursor: pointer;
  }
  .radar-timeline { margin-top: 0.55rem; }
  .radar-rail {
    position: relative; height: 8px; border-radius: 999px; overflow: hidden;
    background: linear-gradient(90deg, #2ec4b6 0 var(--now-pct, 50%), #c9843a var(--now-pct, 50%) 100%);
    opacity: 0.85;
  }
  .radar-now-mark {
    position: absolute; top: -3px; bottom: -3px; width: 2px;
    left: var(--now-pct, 50%); transform: translateX(-1px);
    background: #fff; box-shadow: 0 0 6px rgba(255,255,255,0.7);
  }
  #radarScrub { width: 100%; margin: 0.35rem 0 0.15rem; accent-color: #2ec4b6; }
  .radar-legend {
    display: flex; justify-content: space-between;
    font-size: 0.75rem; color: var(--muted);
  }
  .radar-legend .fcst { color: #ffb070; }
  .radar-legend .obs { color: var(--green); }
  .creek-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 0.75rem; }
  .card {
    background: rgba(7, 28, 34, 0.8); border: 1px solid var(--line);
    border-radius: 12px; padding: 0.9rem 1rem;
  }
  .card h3 {
    margin: 0 0 0.35rem; font-size: 0.8rem; color: var(--teal);
    font-weight: 650; letter-spacing: 0.03em; text-transform: uppercase;
  }
  .big { font-size: 2.2rem; font-weight: 750; letter-spacing: -0.03em; color: var(--green); line-height: 1; }
  .badge {
    display: inline-block; margin-top: 0.55rem; padding: 0.2rem 0.55rem;
    border-radius: 999px; font-size: 0.8rem; font-weight: 650;
  }
  .badge.ok { background: rgba(61,255,168,0.12); color: var(--green); }
  .badge.action { background: rgba(240,193,77,0.15); color: var(--warn); }
  .badge.minor, .badge.moderate, .badge.major { background: rgba(255,107,122,0.15); color: var(--bad); }
  .gauge { margin-top: 0.85rem; height: 12px; background: #12343c; border-radius: 999px; overflow: hidden; }
  .gauge-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--teal), var(--blue), var(--bad)); }
  .gauge-marks { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.75rem; margin-top: 0.3rem; }
  .links a { color: var(--blue); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .impact-list { margin: 0.4rem 0 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.9rem; }
  .hydro { width: 100%; margin-top: 0.75rem; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
  footer { margin-top: 1rem; color: var(--muted); font-size: 0.8rem; text-align: center; }
  @media (max-width: 780px) {
    .wrap { padding: 0.85rem 0.75rem 1.5rem; }
    .panel { padding: 0.7rem; }
    .hint { margin: 0 0 0.45rem; font-size: 0.82rem; }
    header h1 { font-size: 1.25rem; }
    header .sub { font-size: 0.78rem; }
    header { margin-bottom: 0.55rem; }
    nav.tabs { gap: 0.3rem; margin: 0.55rem 0 0.55rem; }
    nav.tabs button { padding: 0.4rem 0.62rem; font-size: 0.82rem; }

    .hour-list.desktop-table { display: none !important; }
    .hour-list.mobile-cards { display: block !important; }

    .hour-card {
      grid-template-columns: 3.2rem minmax(0, 1fr) auto auto;
      gap: 0.2rem 0.5rem;
      padding: 0.4rem 0;
    }
    .hour-card .temp {
      font-size: 1.1rem;
      min-width: 2.8rem;
      align-self: center;
    }
    .hour-card .submetrics { min-width: 3.4rem; }
    .hour-card .wx .detail { display: none; }

    .day-row {
      grid-template-columns: 6.2rem minmax(0, 1fr) auto;
      grid-template-areas:
        "name wx temps"
        "meta meta meta";
      gap: 0.15rem 0.5rem;
      padding: 0.42rem 0;
    }
    .day-name { grid-area: name; font-size: 0.92rem; }
    .day-row > .wx { grid-area: wx; }
    .day-temps { grid-area: temps; min-width: 7.2rem; }
    .day-meta {
      grid-area: meta;
      display: flex;
      flex-wrap: wrap;
      gap: 0.2rem 0.65rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .day-row > .day-rain,
    .day-row > .day-wind { display: none; }
    .creek-grid { grid-template-columns: 1fr; }
  }

  @media (min-width: 781px) {
    .hour-list.mobile-cards { display: none !important; }
    .hour-list.desktop-table { display: block !important; }
    .day-meta { display: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Manhattan, KS</h1>
      <div class="sub">
        Hourly · 10-day · Radar · Wildcat Creek · <span id="generated"></span>
        <span id="liveBadge" class="stale">snapshot</span>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="active" data-tab="hourly">Hourly</button>
      <button data-tab="tenday">10-day</button>
      <button data-tab="radar">Radar</button>
      <button data-tab="creek">Wildcat Creek</button>
    </nav>

    <section id="hourly" class="panel active"></section>
    <section id="tenday" class="panel"></section>
    <section id="radar" class="panel">
      <p class="hint">4 hours of observed NEXRAD (5-min), then NOAA HRRR forecast. Green is real; gold is projected.</p>
      <div id="radarMap"></div>
      <div class="radar-controls">
        <button type="button" id="radarPlay">Pause</button>
        <span class="radar-badge obs" id="radarKind">observed</span>
        <strong class="ts obs" id="radarTime">loading…</strong>
        <span id="radarStatus">starting</span>
      </div>
      <div class="radar-timeline">
        <div class="radar-rail" id="radarRail"><div class="radar-now-mark" title="Now"></div></div>
        <input type="range" id="radarScrub" min="0" max="1" value="0" step="1">
        <div class="radar-legend"><span class="obs">observed</span><span>now</span><span class="fcst">forecast</span></div>
      </div>
    </section>
    <section id="creek" class="panel"></section>

    <footer>NWS hourly · MET Norway 10-day · USGS creek · IEM NEXRAD / HRRR</footer>
  </div>

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function rainPill(v) { return v == null ? '—' : `${v}%`; }
function weekdayName(dateStr) {
  // dateStr: YYYY-MM-DD in America/Chicago calendar sense
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'long', timeZone: 'America/Chicago' });
}

function splitTimeLabel(s) {
  const m = String(s || '').trim().match(/^([A-Za-z]{3})\s+(.+)$/);
  if (m) return { day: m[1], clock: m[2] };
  return { day: '', clock: String(s || '') };

function condLines(label, detail) {
  const l = (label || '').trim();
  const d = (detail || '').trim();
  if (!d) return { label: l, detail: '' };
  const norm = (x) => x.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  if (norm(l) === norm(d) || norm(d).includes(norm(l)) && norm(d).length < norm(l).length + 8) {
    // Prefer the longer/more specific NWS phrase when nearly the same
    return { label: d.length >= l.length ? d : l, detail: '' };
  }
  return { label: l, detail: d };
}

function windDir(deg) {
  if (deg == null || Number.isNaN(+deg)) return '';
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}
function fromText(s, pop) {
  const t = (s || '').toLowerCase();
  const chance = pop == null ? null : Number(pop);
  const isStorm = t.includes('thunder') || t.includes('t-storm') || (t.includes('storm') && !t.includes('dust'));
  if (isStorm) {
    const slight = t.includes('slight') || t.includes('small chance') || t.includes('isolated') || t.includes('scattered');
    const likely = t.includes('likely') || t.includes('numerous') || t.includes('definite') || t.includes('severe');
    if (likely || (chance != null && chance >= 55)) return ['⛈️', 'Storms likely'];
    if (t.includes('isolated')) return ['🌦️', 'Isolated storms'];
    if (slight || (chance != null && chance < 35)) return ['🌦️', 'Slight chance storms'];
    return ['🌦️', 'Chance storms'];
  }
  if (t.includes('snow')) return ['🌨️','Snow'];
  if (t.includes('shower') || t.includes('rain') || t.includes('drizzle')) {
    if (t.includes('slight') || t.includes('isolated') || (chance != null && chance < 35)) return ['🌦️','Slight chance rain'];
    if (t.includes('likely') || (chance != null && chance >= 55)) return ['🌧️','Rain likely'];
    if (t.includes('chance')) return ['🌦️','Chance rain'];
    return ['🌧️','Rain'];
  }
  if (t.includes('fog') || t.includes('haze')) return ['🌫️','Fog'];
  if (t.includes('mostly sunny') || t.includes('mostly clear')) return ['🌤️','Mostly sunny'];
  if (t.includes('partly')) return ['⛅','Partly cloudy'];
  if (t.includes('overcast') || t.includes('cloudy')) return ['☁️','Cloudy'];
  if (t.includes('sunny') || t.includes('clear') || t.includes('fair')) return ['☀️','Clear'];
  return ['🌡️', (s || '—').slice(0, 28)];
}

}

function lerp(a, b, t) { return a + (b - a) * t; }
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [n >> 16, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(x => Math.round(Math.max(0, Math.min(255, x))).toString(16).padStart(2, '0')).join('');
}

  const A = hexToRgb(a), B = hexToRgb(b);

}

function sampleSky(high) {
  const stops = SKY_STOPS;
  if (high <= stops[0].at) return { ...stops[0] };
  if (high >= stops[stops.length - 1].at) return { ...stops[stops.length - 1] };
  for (let i = 1; i < stops.length; i++) {
    if (high <= stops[i].at) {
      const t = (high - stops[i - 1].at) / (stops[i].at - stops[i - 1].at);
      const out = {};
      for (const k of ['top', 'mid', 'bot', 'glowA', 'glowB', 'accent']) {
        out[k] = mixHex(stops[i - 1][k], stops[i][k], t);
      }
      return out;
    }
  }
  return { ...stops[3] };
}
function mixSky(a, b, t) {
  if (t <= 0) return a;
  if (t >= 1) return b;
  const out = {};
  for (const k of Object.keys(a)) out[k] = mixHex(a[k], b[k], t);
  return out;
}

function applySky(data) {
  const hours = data.hourly || [];
  const days = data.daily || [];
  const near = hours.slice(0, 8);
  const temps = near.map(h => Number(h.temp)).filter(n => !Number.isNaN(n));
  const high = (days[0] && typeof days[0].high === 'number')
    ? days[0].high
    : (temps.length ? Math.max(...temps) : 75);

  let sky = sampleSky(high);
  const blob = near.map(wxText).join(' ');
  const rainPcts = near.map(h => Number(h.rain)).filter(n => !Number.isNaN(n));
  const maxRain = rainPcts.length ? Math.max(...rainPcts) : (days[0]?.rain ?? 0) || 0;
  const isStorm = /thunder|t-storm|storm/.test(blob);
  const isSnow = /snow|sleet|blizzard|wintry/.test(blob);
  const isRain = isStorm || /rain|shower|drizzle/.test(blob) || maxRain >= 35;

  let weatherMix = 0;
  let overlay = RAIN_SKY;
  if (isSnow) { overlay = SNOW_SKY; weatherMix = 0.55; }
  else if (isStorm) { overlay = STORM_SKY; weatherMix = 0.62; }
  else if (isRain) {
    overlay = RAIN_SKY;
    weatherMix = Math.min(0.55, 0.18 + maxRain / 180);
  }
  sky = mixSky(sky, overlay, weatherMix);

  const root = document.documentElement;
  const body = document.body;
  body.style.setProperty('--sky-top', sky.top);
  body.style.setProperty('--sky-mid', sky.mid);
  body.style.setProperty('--sky-bot', sky.bot);
  body.style.setProperty('--glow-a', rgbaFromHex(sky.glowA, isStorm ? 0.32 : 0.24));
  body.style.setProperty('--glow-b', rgbaFromHex(sky.glowB, 0.22));
  root.style.setProperty('--green', sky.accent);
  body.classList.toggle('sky-rain', isRain && !isSnow);
  body.classList.toggle('sky-storm', isStorm);
  body.style.setProperty('--rain-opacity', isStorm ? '0.38' : (isRain ? '0.26' : '0'));
}

async function fetchJson(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error(`${url} → ${res.status}`);
  return res.json();
}

async function loadHourlyNws() {
  // No custom headers — avoids CORS preflight issues in the browser.
  const data = await fetchJson(
    `https://api.weather.gov/gridpoints/TOP/50,55/forecast/hourly`
  );
  return data.properties.periods.slice(0, 48).map(p => {
    const t = new Date(p.startTime);
    const rain = (p.probabilityOfPrecipitation || {}).value;
    const [emoji, label] = fromText(p.shortForecast, rain);
    return {
      t: t.toLocaleString('en-US', { timeZone: 'America/Chicago', weekday: 'short', hour: 'numeric' }).replace(',', ''),
      temp: p.temperature,
      emoji, label,
      detail: p.shortForecast,
      rain,
      wind: `${p.windSpeed} ${p.windDirection}`
    };
  });
}

async function loadDailyMet() {

  );
  const byDay = {};
  for (const p of data.properties.timeseries) {
    const local = new Date(p.time);
    const key = local.toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
    (byDay[key] ||= []).push(p);
  }
  const todayStr = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
  const tom = new Date(); tom.setDate(tom.getDate() + 1);
  const tomStr = tom.toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
  const days = [];
  for (const day of Object.keys(byDay).sort()) {
    if (days.length >= 10) break;
    if (day < todayStr) continue;
    const pts = byDay[day];
    const temps = [], rains = [], winds = [], windDegs = [], symbols = [];
    for (const p of pts) {
      const inst = p.data.instant?.details || {};
      if (inst.air_temperature != null) temps.push(inst.air_temperature * 9/5 + 32);
      if (inst.wind_speed != null) winds.push(inst.wind_speed * 2.23694);
      if (inst.wind_from_direction != null) windDegs.push(inst.wind_from_direction);
      for (const key of ['next_6_hours','next_12_hours','next_1_hours']) {
        const block = p.data[key];
        if (!block) continue;
        if (block.summary?.symbol_code) symbols.push(block.summary.symbol_code);
        if (block.details?.probability_of_precipitation != null) {
          rains.push(block.details.probability_of_precipitation);
        }
        break;
      }
    }
    if (!temps.length) continue;
    const [emoji, label] = fromSymbol(symbols[Math.floor(symbols.length / 2)]);
    const name = weekdayName(day);
    const avgDir = windDegs.length ? windDir(windDegs.reduce((a,b)=>a+b,0)/windDegs.length) : '';
    days.push({
      name, date: day, emoji, label,
      high: Math.round(Math.max(...temps)),
      low: Math.round(Math.min(...temps)),
      rain: rains.length ? Math.round(Math.max(...rains)) : null,
      wind: winds.length ? `${Math.round(Math.max(...winds))} mph ${avgDir}`.trim() : '—'
    });
  }
  return days;
}

async function loadDailyMapClick() {
  const data = await fetchJson(
    `https://forecast.weather.gov/MapClick.php?lat=${LAT}&lon=${LON}&unit=0&lg=english&FcstType=json`
  );
  const names = data.time.startPeriodName || [];
  const temps = data.data.temperature || [];
  const pops = data.data.pop || [];
  const weather = data.data.weather || [];
  const labels = data.time.tempLabel || [];
  const days = [];
  let i = 0;
  while (i < names.length && days.length < 10) {
    const name = names[i];
    const isDay = (labels[i] || '').toLowerCase() === 'high' || /morning|afternoon|today|monday|tuesday|wednesday|thursday|friday|saturday|sunday/i.test(name) && !/night/i.test(name);
    let high = null, low = null, rain = null, label = weather[i] || '—', dayName = name;
    if (labels[i] === 'High') {
      high = parseInt(temps[i], 10);
      rain = pops[i] !== '' && pops[i] != null ? parseInt(pops[i], 10) : null;
      if (i + 1 < names.length && labels[i + 1] === 'Low') {
        low = parseInt(temps[i + 1], 10);
        i += 2;
      } else {
        i += 1;
      }
    } else if (labels[i] === 'Low') {
      low = parseInt(temps[i], 10);
      rain = pops[i] !== '' && pops[i] != null ? parseInt(pops[i], 10) : null;
      i += 1;
    } else {
      i += 1;
      continue;
    }
    const [emoji, shortLabel] = fromText(label, rain);
    const cleaned = dayName.replace(/ Night$/,'');
    const weekdays = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    let nice = cleaned;
    for (const w of weekdays) {
      if (cleaned.toLowerCase().startsWith(w.toLowerCase()) || cleaned.toLowerCase().includes(w.toLowerCase())) {
        nice = w; break;
      }
    }
    if (/today|tonight|this afternoon|this morning/i.test(cleaned)) {
      nice = weekdayName(new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' }));
    }
    days.push({
      name: nice,
      emoji, label: shortLabel,
      high: high ?? (low != null ? low + 10 : 70),
      low: low ?? (high != null ? high - 10 : 55),
      rain,
      wind: '—'
    });
  }
  return days.slice(0, 10);
}

async function loadCreekUsgs() {
  const usgs = await fetchJson(
    'https://waterservices.usgs.gov/nwis/iv/?sites=06879810,06879815&parameterCd=00065,00060&format=json'
  );
  const creek = {};
  for (const ts of usgs.value.timeSeries) {
    const code = ts.sourceInfo.siteCode[0].value;
    creek[code] = creek[code] || { name: ts.sourceInfo.siteName, code };
    const v = ts.values[0].value[0];
    const varCode = ts.variable.variableCode[0].value;
    if (varCode === '00065') { creek[code].stage = parseFloat(v.value); creek[code].when = v.dateTime; }
    if (varCode === '00060') { creek[code].flow = parseFloat(v.value); }
  }
  let fcstActive = false;
  try {
    const mw = await fetchJson('https://api.water.noaa.gov/nwps/v1/gauges/mwck1');
    fcstActive = mw.status?.forecast?.floodCategory !== 'fcst_not_current';
  } catch (_) {}
  return {
    scenic: creek['06879810'],
    seth: creek['06879815'],
    thresholds: CREEK_THRESHOLDS,
    impacts: CREEK_IMPACTS,
    fcstActive,
    hydro: HYDRO_URL
  };
}

let state = JSON.parse(JSON.stringify(SNAP));

async function refreshLive() {
  if (location.protocol === 'file:') {
    setBadge('err', 'serve over http for live');
    return;
  }
  setBadge('stale', 'updating…');
  const results = await Promise.allSettled([
    loadHourlyNws(),
    loadDailyMet().catch(async (err) => {
      console.warn('met.no failed, trying NWS MapClick', err);
      return loadDailyMapClick();
    }),
    loadCreekUsgs()
  ]);
  const [h, d, c] = results;
  let ok = 0;
  if (h.status === 'fulfilled') { state.hourly = h.value; ok++; }
  else console.warn('hourly failed', h.reason);
  if (d.status === 'fulfilled') { state.daily = d.value; ok++; }
  else console.warn('daily failed', d.reason);
  if (c.status === 'fulfilled') { state.creek = c.value; ok++; }
  else console.warn('creek failed', c.reason);

  if (ok === 0) {
    setBadge('err', 'snapshot (live failed)');
    return;
  }
  state.generated = stampNow();
  render(state);
  if (ok === 3) setBadge('', 'live');
  else setBadge('stale', `live (${ok}/3)`);
}

render(state);
setBadge('stale', location.protocol === 'file:' ? 'snapshot (file://)' : 'snapshot');
setTimeout(refreshLive, 50);
setInterval(refreshLive, 10 * 60 * 1000);

document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'radar') setTimeout(() => radarMap && radarMap.invalidateSize(), 50);
  });
});

let radarMap, radarLayer = null, radarTimer = null, radarIdx = 0, radarFrames = [], radarPlaying = true, lastObsIdx = 0;

function iemTile(layerName) {
  return `https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/${layerName}/{z}/{x}/{y}.png`;
}
function utcStamp(d) {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}${p(d.getUTCMonth()+1)}${p(d.getUTCDate())}${p(d.getUTCHours())}${p(d.getUTCMinutes())}`;
}
function floorUtc(d, stepMin) {
  const ms = stepMin * 60 * 1000;
  return new Date(Math.floor(d.getTime() / ms) * ms);
}
function fmtRadarTime(d) {
  return d.toLocaleString('en-US', {
    timeZone: 'America/Chicago', weekday: 'short', hour: 'numeric', minute: '2-digit'
  });
}

async function startRadar() {
  const status = document.getElementById('radarStatus');
  const kindEl = document.getElementById('radarKind');
  const timeEl = document.getElementById('radarTime');
  const scrub = document.getElementById('radarScrub');
  const playBtn = document.getElementById('radarPlay');
  const rail = document.getElementById('radarRail');
  try {
    radarMap = L.map('radarMap', {
      zoomControl: true, attributionControl: true, minZoom: 4, maxZoom: 10
    }).setView([LAT, LON], 7);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO · radar IEM / NOAA',
      maxZoom: 10
    }).addTo(radarMap);
    L.circleMarker([LAT, LON], {
      radius: 6, color: '#3dffa8', fillColor: '#3dffa8', fillOpacity: 0.9, weight: 2
    }).addTo(radarMap).bindTooltip('Manhattan');

    const now = new Date();
    // Observed: 4 hours of CONUS NEXRAD mosaic, every 5 minutes (IEM native step).
    const latestObs = floorUtc(new Date(now.getTime() - 2 * 60 * 1000), 5);
    const obs = [];
    for (let min = 4 * 60; min >= 0; min -= 5) {
      const t = new Date(latestObs.getTime() - min * 60 * 1000);
      obs.push({
        time: t,
        kind: 'obs',
        url: iemTile(`ridge::USCOMP-N0Q-${utcStamp(t)}`)
      });
    }

    // Forecast: HRRR simulated reflectivity, 15-min steps, ~6 hours ahead of now.
    let initUtc = null;
    try {
      const meta = await fetchJson('https://mesonet.agron.iastate.edu/data/gis/images/4326/hrrr/refd_1080.json');
      initUtc = new Date(meta.model_init_utc);
    } catch (_) {}
    const fcst = [];
    if (initUtc && !Number.isNaN(initUtc.getTime())) {
      const initStamp = utcStamp(initUtc);
      const horizon = new Date(now.getTime() + 6 * 60 * 60 * 1000);
      for (let m = 0; m <= 18 * 60; m += 15) {
        const valid = new Date(initUtc.getTime() + m * 60 * 1000);
        if (valid <= latestObs) continue;
        if (valid > horizon) break;
        fcst.push({
          time: valid,
          kind: 'fcst',
          url: iemTile(`hrrr::REFD-F${String(m).padStart(4, '0')}-${initStamp}`)
        });
      }
    }

    radarFrames = obs.concat(fcst);
    lastObsIdx = obs.length - 1;
    if (!radarFrames.length) { status.textContent = 'no radar frames'; return; }

    const nowPct = lastObsIdx / Math.max(1, radarFrames.length - 1) * 100;
    rail.style.setProperty('--now-pct', `${nowPct}%`);
    scrub.max = String(radarFrames.length - 1);

    // Preload every frame as its own layer so playback is an opacity swap, not a tile fetch.
    const layers = radarFrames.map((f) =>
      L.tileLayer(f.url, {
        opacity: 0, zIndex: 10, maxNativeZoom: 8, maxZoom: 10, tileSize: 256
      }).addTo(radarMap)
    );
    radarLayer = layers;

    function show(i) {
      const prev = radarIdx;
      radarIdx = i;
      if (layers[prev]) layers[prev].setOpacity(0);
      layers[i].setOpacity(0.72);
      const f = radarFrames[i];
      const isFcst = f.kind === 'fcst';
      kindEl.textContent = isFcst ? 'forecast · HRRR' : 'observed · NEXRAD';
      kindEl.className = 'radar-badge ' + (isFcst ? 'fcst' : 'obs');
      timeEl.textContent = fmtRadarTime(f.time);
      timeEl.className = 'ts ' + (isFcst ? 'fcst' : 'obs');
      status.textContent = isFcst ? 'projected' : (i === lastObsIdx ? 'now' : 'observed');
      scrub.value = String(i);
      scrub.style.accentColor = isFcst ? '#c9843a' : '#2ec4b6';
    }

    const FRAME_MS = 110;
    const SEAM_MS = 320;
    function tick() {
      const next = (radarIdx + 1) % radarFrames.length;
      show(next);
      const delay = (radarIdx === lastObsIdx || next === 0) ? SEAM_MS : FRAME_MS;
      radarTimer = setTimeout(tick, delay);
    }
    function play() {
      if (radarTimer) clearTimeout(radarTimer);
      radarPlaying = true;
      playBtn.textContent = 'Pause';
      radarTimer = setTimeout(tick, FRAME_MS);
    }
    function pause() {
      radarPlaying = false;
      playBtn.textContent = 'Play';
      if (radarTimer) { clearTimeout(radarTimer); radarTimer = null; }
    }

    show(0);
    play();
    playBtn.addEventListener('click', () => radarPlaying ? pause() : play());
    scrub.addEventListener('input', () => {
      pause();
      show(Number(scrub.value));
    });
    status.textContent = 'now';
  } catch (e) {
    status.textContent = 'radar failed to load';
    console.error(e);
  }
}
startRadar();
