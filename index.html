<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manhattan Weather</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #071a1f;
    --bg2: #0c2a32;
    --panel: rgba(8, 36, 42, 0.92);
    --line: rgba(120, 220, 200, 0.18);
    --text: #e7f7f2;
    --muted: #8fb3ad;
    --green: #3dffa8;
    --teal: #2ec4b6;
    --blue: #4da3ff;
    --warn: #f0c14d;
    --bad: #ff6b7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(46, 196, 182, 0.22), transparent 55%),
      radial-gradient(700px 420px at 100% 0%, rgba(77, 163, 255, 0.18), transparent 50%),
      linear-gradient(180deg, #062028 0%, #071a1f 40%, #06151c 100%);
    min-height: 100vh;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 1.25rem 1rem 2.5rem; }
  header { margin-bottom: 0.85rem; }
  header h1 {
    margin: 0; font-size: 1.55rem; font-weight: 700;
    letter-spacing: -0.02em; color: var(--green);
  }
  header .sub { color: var(--muted); margin-top: 0.25rem; font-size: 0.95rem; }
  #liveBadge {
    display: inline-block; margin-left: 0.35rem;
    padding: 0.1rem 0.45rem; border-radius: 999px;
    font-size: 0.75rem; font-weight: 650;
    background: rgba(61,255,168,0.12); color: var(--green);
    vertical-align: 0.05rem;
  }
  #liveBadge.stale { background: rgba(240,193,77,0.15); color: var(--warn); }
  #liveBadge.err { background: rgba(255,107,122,0.15); color: var(--bad); }
  nav.tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.9rem 0 0.85rem; }
  nav.tabs button {
    appearance: none; border: 1px solid var(--line); background: var(--bg2);
    color: var(--muted); padding: 0.5rem 0.9rem; border-radius: 999px;
    font: inherit; font-size: 0.92rem; cursor: pointer;
  }
  nav.tabs button:hover { color: var(--text); border-color: var(--teal); }
  nav.tabs button.active {
    background: linear-gradient(135deg, #1a6b5c, #1a5f8a);
    color: #fff; border-color: transparent; font-weight: 600;
  }
  .panel {
    display: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 0.95rem;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }
  .panel.active { display: block; }
  .hint { color: var(--muted); margin: 0 0 0.85rem; font-size: 0.9rem; }
  .wx { display: flex; align-items: center; gap: 0.65rem; min-width: 0; }
  .wx { gap: 0.45rem; }
  .wx .emoji {
    width: 1.9rem; height: 1.9rem; display: grid; place-items: center;
    font-size: 1.2rem; line-height: 1;
    background: rgba(46, 196, 182, 0.12);
    border: 1px solid var(--line); border-radius: 8px; flex: 0 0 auto;
  }
  .wx .label { font-weight: 600; font-size: 0.95rem; line-height: 1.2; }
  .wx .detail { color: var(--muted); font-size: 0.78rem; line-height: 1.2; }
  /* keep rows tight: hide secondary condition line */
  .hour-card .wx .detail, .day-row .wx .detail { display: none; }
  .temp { font-weight: 700; font-variant-numeric: tabular-nums; color: #b8ffe0; font-size: 1rem; }
  .pill {
    display: inline-block; min-width: 2.4rem; text-align: center;
    background: rgba(77, 163, 255, 0.15); color: #9fd0ff;
    border-radius: 999px; padding: 0.05rem 0.4rem; font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
  }
  .day-group {
    color: var(--teal); font-size: 0.72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em;
    margin: 0.55rem 0 0.15rem; padding-bottom: 0.15rem;
    border-bottom: 1px solid var(--line);
  }
  .day-group:first-child { margin-top: 0; }
  .hour-card {
    display: grid;
    grid-template-columns: 3.6rem 1fr auto;
    gap: 0.25rem 0.55rem;
    align-items: center;
    padding: 0.42rem 0.1rem;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .hour-card .time {
    font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text);
  }
  .hour-card .metrics {
    display: flex; flex-wrap: nowrap; gap: 0.35rem 0.45rem;
    justify-content: flex-end; align-items: center;
    font-variant-numeric: tabular-nums;
  }
  .hour-card .wind {
    color: var(--muted); font-size: 0.82rem; white-space: nowrap;
  }
  .day-row {
    display: grid;
    grid-template-columns: 4.8rem minmax(0, 1.2fr) minmax(6.5rem, 1fr);
    gap: 0.25rem 0.55rem;
    align-items: center;
    padding: 0.45rem 0.1rem;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .day-name { font-weight: 650; }
  .day-temps { display: flex; align-items: center; gap: 0.45rem; font-variant-numeric: tabular-nums; }
  .lo { color: var(--muted); width: 2.2rem; text-align: right; flex: 0 0 auto; }
  .hi { font-weight: 700; width: 2.2rem; color: #b8ffe0; flex: 0 0 auto; }
  .bar-track { flex: 1; height: 8px; background: #12343c; border-radius: 999px; position: relative; overflow: hidden; min-width: 2.5rem; }
  .bar-fill {
    position: absolute; top: 0; bottom: 0; border-radius: 999px;
    background: linear-gradient(90deg, var(--blue), var(--teal), var(--green));
  }
  .day-meta {
    grid-column: 1 / -1;
    display: flex; flex-wrap: wrap; gap: 0.2rem 0.65rem;
    color: var(--muted); font-size: 0.8rem;
  }
  .day-wind { color: var(--muted); font-size: 0.8rem; }
  #radarMap {
    height: min(62vh, 560px); border-radius: 12px;
    border: 1px solid var(--line); background: #0a2028;
  }
  .radar-controls {
    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
    margin-top: 0.65rem; color: var(--muted); font-size: 0.9rem;
  }
  .radar-controls .ts { color: var(--green); font-variant-numeric: tabular-nums; }
  .creek-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 0.75rem; }
  .card {
    background: rgba(7, 28, 34, 0.8); border: 1px solid var(--line);
    border-radius: 12px; padding: 0.9rem 1rem;
  }
  .card h3 {
    margin: 0 0 0.35rem; font-size: 0.8rem; color: var(--teal);
    font-weight: 650; letter-spacing: 0.03em; text-transform: uppercase;
  }
  .big { font-size: 2.2rem; font-weight: 750; letter-spacing: -0.03em; color: var(--green); line-height: 1; }
  .badge {
    display: inline-block; margin-top: 0.55rem; padding: 0.2rem 0.55rem;
    border-radius: 999px; font-size: 0.8rem; font-weight: 650;
  }
  .badge.ok { background: rgba(61,255,168,0.12); color: var(--green); }
  .badge.action { background: rgba(240,193,77,0.15); color: var(--warn); }
  .badge.minor, .badge.moderate, .badge.major { background: rgba(255,107,122,0.15); color: var(--bad); }
  .gauge { margin-top: 0.85rem; height: 12px; background: #12343c; border-radius: 999px; overflow: hidden; }
  .gauge-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--teal), var(--blue), var(--bad)); }
  .gauge-marks { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.75rem; margin-top: 0.3rem; }
  .links a { color: var(--blue); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .impact-list { margin: 0.4rem 0 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.9rem; }
  .hydro { width: 100%; margin-top: 0.75rem; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
  footer { margin-top: 1rem; color: var(--muted); font-size: 0.8rem; text-align: center; }
  @media (max-width: 780px) {
    .wrap { padding: 0.85rem 0.75rem 1.5rem; }
    .panel { padding: 0.7rem; }
    .hint { margin: 0 0 0.45rem; font-size: 0.82rem; }
    header h1 { font-size: 1.25rem; }
    header .sub { font-size: 0.78rem; }
    header { margin-bottom: 0.55rem; }
    nav.tabs { gap: 0.3rem; margin: 0.55rem 0 0.55rem; }
    nav.tabs button { padding: 0.4rem 0.62rem; font-size: 0.82rem; }
    .hour-card {
      grid-template-columns: 3.2rem minmax(0, 1fr) auto;
      grid-template-areas: "time wx metrics";
      gap: 0.2rem 0.45rem;
      padding: 0.38rem 0;
    }
    .hour-card .time { grid-area: time; font-size: 0.9rem; }
    .hour-card .wx { grid-area: wx; }
    .hour-card .metrics {
      grid-area: metrics;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.12rem;
      justify-content: center;
    }
    .hour-card .wind { font-size: 0.75rem; }
    .day-row {
      grid-template-columns: 4.2rem minmax(0, 1fr) auto;
      grid-template-areas:
        "name wx temps"
        "meta meta meta";
      gap: 0.15rem 0.45rem;
      padding: 0.4rem 0;
    }
    .day-name { grid-area: name; align-self: center; font-size: 0.9rem; }
    .day-row > .wx { grid-area: wx; }
    .day-temps { grid-area: temps; min-width: 7.5rem; }
    .day-meta { grid-area: meta; margin-top: 0.05rem; }
    .creek-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Manhattan, KS</h1>
      <div class="sub">
        Hourly · 10-day · Radar · Wildcat Creek · <span id="generated"></span>
        <span id="liveBadge" class="stale">snapshot</span>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="active" data-tab="hourly">Hourly</button>
      <button data-tab="tenday">10-day</button>
      <button data-tab="radar">Radar</button>
      <button data-tab="creek">Wildcat Creek</button>
    </nav>

    <section id="hourly" class="panel active"></section>
    <section id="tenday" class="panel"></section>
    <section id="radar" class="panel">
      <p class="hint">Animated rain radar (past + short nowcast). Plays automatically.</p>
      <div id="radarMap"></div>
      <div class="radar-controls">
        <span>Frame: <strong class="ts" id="radarTime">loading…</strong></span>
        <span id="radarStatus">starting</span>
      </div>
    </section>
    <section id="creek" class="panel"></section>

    <footer>NWS hourly · MET Norway 10-day · USGS creek · RainViewer radar</footer>
  </div>

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function rainPill(v) { return v == null ? '—' : `${v}%`; }

function splitTimeLabel(s) {
  const m = String(s || '').trim().match(/^([A-Za-z]{3})\s+(.+)$/);
  if (m) return { day: m[1], clock: m[2] };
  return { day: '', clock: String(s || '') };
}
function condLines(label, detail) {
  const l = (label || '').trim();
  const d = (detail || '').trim();
  if (!d) return { label: l, detail: '' };
  const norm = (x) => x.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  if (norm(l) === norm(d) || norm(d).includes(norm(l)) && norm(d).length < norm(l).length + 8) {
    // Prefer the longer/more specific NWS phrase when nearly the same
    return { label: d.length >= l.length ? d : l, detail: '' };
  }
  return { label: l, detail: d };
}

function windDir(deg) {
  if (deg == null || Number.isNaN(+deg)) return '';
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}
function fromText(s) {
  const t = (s || '').toLowerCase();
  if (t.includes('thunder') || t.includes('t-storm') || t.includes('storm')) return ['⛈️','Storms'];
  if (t.includes('snow')) return ['🌨️','Snow'];
  if (t.includes('shower') || t.includes('rain') || t.includes('drizzle')) return ['🌧️','Rain'];
  if (t.includes('fog') || t.includes('haze')) return ['🌫️','Fog'];
  if (t.includes('mostly sunny') || t.includes('mostly clear')) return ['🌤️','Mostly sunny'];
  if (t.includes('partly')) return ['⛅','Partly cloudy'];
  if (t.includes('overcast') || t.includes('cloudy')) return ['☁️','Cloudy'];

    }
    const c = condLines(r.label, r.detail);
    hparts.push(`<div class="hour-card">
      <div class="time">${esc(clock || r.t)}</div>
      <div class="wx"><div class="emoji" title="${esc(r.detail || r.label)}">${r.emoji}</div>
        <div><div class="label">${esc(c.label)}</div>
        ${c.detail ? `<div class="detail">${esc(c.detail)}</div>` : ''}</div></div>
      <div class="metrics">
        <span class="temp">${esc(r.temp)}°</span>
        <span class="pill">${rainPill(r.rain)}</span>
        <span class="wind">${esc(r.wind)}</span>
      </div>
    </div>`);
  }
  document.getElementById('hourly').innerHTML = `
    <p class="hint">Next 24 hours</p>
    <div class="hour-list">${hparts.join('')}</div>`;

  const drows = data.daily.map(d => {
    const left = Math.max(0, Math.min(100, (d.low - 55) / 50 * 100));
    const width = Math.max(4, Math.min(100 - left, (d.high - d.low) / 50 * 100));
    const rain = d.rain == null ? '—' : `${d.rain}% rain`;
    return `<div class="day-row">
      <div class="day-name">${esc(d.name)}</div>
      <div class="wx"><div class="emoji">${d.emoji}</div>
        <div><div class="label">${esc(d.label)}</div></div></div>
      <div class="day-temps"><span class="lo">${d.low}°</span><div class="bar-track"><div class="bar-fill" style="left:${left.toFixed(1)}%;width:${width.toFixed(1)}%"></div></div><span class="hi">${d.high}°</span></div>
      <div class="day-meta"><span>${esc(rain)}</span><span class="day-wind">${esc(d.wind)}</span></div>
    </div>`;
  }).join('');
  document.getElementById('tenday').innerHTML = `<p class="hint">${data.daily.length}-day outlook.</p>${drows}`;

  const c = data.creek;
  const t = c.thresholds || CREEK_THRESHOLDS;
  const stage = c.scenic.stage;
  const pct = Math.min(100, Math.max(2, (stage / t.major) * 100));
  let label = 'Normal / low', cls = 'ok';
  if (stage >= t.major) { label = 'Major flooding'; cls = 'major'; }
  else if (stage >= t.moderate) { label = 'Moderate flooding'; cls = 'moderate'; }
  else if (stage >= t.minor) { label = 'Minor flooding'; cls = 'minor'; }
  else if (stage >= t.action) { label = 'Action stage'; cls = 'action'; }
  const fcst = c.fcstActive ? 'Stage forecast is active on NWS MWCK1.' : 'No active stage forecast today.';
  const impacts = (c.impacts || CREEK_IMPACTS).slice().sort((a,b)=>a.stage-b.stage)
    .map(i => `<li><strong>${esc(i.stage)} ft</strong> — ${esc(i.statement)}</li>`).join('');

  document.getElementById('creek').innerHTML = `
    <p class="hint">${esc(fcst)} Flood stage (minor) is ${t.minor} ft at Scenic Drive.</p>
    <div class="creek-grid">
      <div class="card">
        <h3>Scenic Drive · 06879810</h3>
        <div class="big">${Number(stage).toFixed(2)} <span style="font-size:1rem;font-weight:600;color:var(--muted)">ft</span></div>
        <div style="color:var(--muted);margin-top:0.35rem">${c.scenic.flow ?? '—'} cfs · ${esc(c.scenic.when)}</div>
        <span class="badge ${cls}">${label}</span>
        <div class="gauge"><div class="gauge-fill" style="width:${pct.toFixed(1)}%"></div></div>
        <div class="gauge-marks"><span>0</span><span>Action ${t.action}</span><span>Flood ${t.minor}</span><span>Major ${t.major}</span></div>
      </div>
      <div class="card">
        <h3>Seth Childs Rd · 06879815</h3>
        <div class="big">${Number(c.seth.stage).toFixed(2)} <span style="font-size:1rem;font-weight:600;color:var(--muted)">ft</span></div>
        <div style="color:var(--muted);margin-top:0.35rem">Gage height only · ${esc(c.seth.when)}</div>
        <div class="links" style="margin-top:0.85rem">
          <div><a href="https://water.noaa.gov/gauges/mwck1" target="_blank" rel="noopener">NWS MWCK1</a></div>
          <div><a href="https://waterdata.usgs.gov/nwis/uv?site_no=06879810" target="_blank" rel="noopener">USGS Scenic Drive</a></div>
          <div><a href="https://waterdata.usgs.gov/nwis/uv?site_no=06879815" target="_blank" rel="noopener">USGS Seth Childs</a></div>
        </div>
      </div>
    </div>
    <img class="hydro" src="${esc(c.hydro || HYDRO_URL)}?t=${Date.now()}" alt="Wildcat Creek hydrograph" loading="lazy">
    <div class="card" style="margin-top:0.75rem">
      <h3>Impact thresholds</h3>
      <ul class="impact-list">${impacts}</ul>
    </div>`;
}

async function fetchJson(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error(`${url} → ${res.status}`);
  return res.json();
}

async function loadHourlyNws() {
  // No custom headers — avoids CORS preflight issues in the browser.
  const data = await fetchJson(
    `https://api.weather.gov/gridpoints/TOP/50,55/forecast/hourly`
  );
  return data.properties.periods.slice(0, 24).map(p => {
    const t = new Date(p.startTime);
    const [emoji, label] = fromText(p.shortForecast);
    return {
      t: t.toLocaleString('en-US', { timeZone: 'America/Chicago', weekday: 'short', hour: 'numeric' }).replace(',', ''),
      temp: p.temperature,
      emoji, label,
      detail: p.shortForecast,
      rain: (p.probabilityOfPrecipitation || {}).value,
      wind: `${p.windSpeed} ${p.windDirection}`
    };
  });
}

async function loadDailyMet() {
  // compact + no custom headers (met.no 403s / fails preflight on custom User-Agent)
  const data = await fetchJson(
    `https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${LAT}&lon=${LON}`
  );
  const byDay = {};
  for (const p of data.properties.timeseries) {
    const local = new Date(p.time);
    const key = local.toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
    (byDay[key] ||= []).push(p);
  }
  const todayStr = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
  const tom = new Date(); tom.setDate(tom.getDate() + 1);
  const tomStr = tom.toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
  const days = [];
  for (const day of Object.keys(byDay).sort()) {
    if (days.length >= 10) break;
    if (day < todayStr) continue;
    const pts = byDay[day];
    const temps = [], rains = [], winds = [], windDegs = [], symbols = [];
    for (const p of pts) {
      const inst = p.data.instant?.details || {};
      if (inst.air_temperature != null) temps.push(inst.air_temperature * 9/5 + 32);
      if (inst.wind_speed != null) winds.push(inst.wind_speed * 2.23694);
      if (inst.wind_from_direction != null) windDegs.push(inst.wind_from_direction);
      for (const key of ['next_6_hours','next_12_hours','next_1_hours']) {
        const block = p.data[key];
        if (!block) continue;
        if (block.summary?.symbol_code) symbols.push(block.summary.symbol_code);
        if (block.details?.probability_of_precipitation != null) {
          rains.push(block.details.probability_of_precipitation);
        }
        break;
      }
    }
    if (!temps.length) continue;
    const [emoji, label] = fromSymbol(symbols[Math.floor(symbols.length / 2)]);
    let name;
    if (day === todayStr) name = 'Today';
    else if (day === tomStr) name = 'Tomorrow';
    else name = new Date(day + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
    const avgDir = windDegs.length ? windDir(windDegs.reduce((a,b)=>a+b,0)/windDegs.length) : '';
    days.push({
      name, date: day, emoji, label,
      high: Math.round(Math.max(...temps)),
      low: Math.round(Math.min(...temps)),
      rain: rains.length ? Math.round(Math.max(...rains)) : null,
      wind: winds.length ? `${Math.round(Math.max(...winds))} mph ${avgDir}`.trim() : '—'
    });
  }
  return days;
}

async function loadDailyMapClick() {
  const data = await fetchJson(
    `https://forecast.weather.gov/MapClick.php?lat=${LAT}&lon=${LON}&unit=0&lg=english&FcstType=json`
  );
  const names = data.time.startPeriodName || [];
  const temps = data.data.temperature || [];
  const pops = data.data.pop || [];
  const weather = data.data.weather || [];
  const labels = data.time.tempLabel || [];
  const days = [];
  let i = 0;
  while (i < names.length && days.length < 10) {
    const name = names[i];
    const isDay = (labels[i] || '').toLowerCase() === 'high' || /morning|afternoon|today|monday|tuesday|wednesday|thursday|friday|saturday|sunday/i.test(name) && !/night/i.test(name);
    let high = null, low = null, rain = null, label = weather[i] || '—', dayName = name;
    if (labels[i] === 'High') {
      high = parseInt(temps[i], 10);
      rain = pops[i] !== '' && pops[i] != null ? parseInt(pops[i], 10) : null;
      if (i + 1 < names.length && labels[i + 1] === 'Low') {
        low = parseInt(temps[i + 1], 10);
        i += 2;
      } else {
        i += 1;
      }
    } else if (labels[i] === 'Low') {
      low = parseInt(temps[i], 10);
      rain = pops[i] !== '' && pops[i] != null ? parseInt(pops[i], 10) : null;
      i += 1;
    } else {
      i += 1;
      continue;
    }
    const [emoji, shortLabel] = fromText(label);
    days.push({
      name: dayName.replace(/ Night$/,''),
      emoji, label: shortLabel,
      high: high ?? (low != null ? low + 10 : 70),
      low: low ?? (high != null ? high - 10 : 55),
      rain,
      wind: '—'
    });
  }
  return days.slice(0, 10);
}

async function loadCreekUsgs() {
  const usgs = await fetchJson(
    'https://waterservices.usgs.gov/nwis/iv/?sites=06879810,06879815&parameterCd=00065,00060&format=json'
  );
  const creek = {};
  for (const ts of usgs.value.timeSeries) {
    const code = ts.sourceInfo.siteCode[0].value;
    creek[code] = creek[code] || { name: ts.sourceInfo.siteName, code };
    const v = ts.values[0].value[0];
    const varCode = ts.variable.variableCode[0].value;
    if (varCode === '00065') { creek[code].stage = parseFloat(v.value); creek[code].when = v.dateTime; }
    if (varCode === '00060') { creek[code].flow = parseFloat(v.value); }
  }
  let fcstActive = false;
  try {
    const mw = await fetchJson('https://api.water.noaa.gov/nwps/v1/gauges/mwck1');
    fcstActive = mw.status?.forecast?.floodCategory !== 'fcst_not_current';
  } catch (_) {}
  return {
    scenic: creek['06879810'],
    seth: creek['06879815'],
    thresholds: CREEK_THRESHOLDS,
    impacts: CREEK_IMPACTS,
    fcstActive,
    hydro: HYDRO_URL
  };
}

let state = JSON.parse(JSON.stringify(SNAP));

async function refreshLive() {
  if (location.protocol === 'file:') {
    setBadge('err', 'serve over http for live');
    return;
  }
  setBadge('stale', 'updating…');
  const results = await Promise.allSettled([
    loadHourlyNws(),
    loadDailyMet().catch(async (err) => {
      console.warn('met.no failed, trying NWS MapClick', err);
      return loadDailyMapClick();
    }),
    loadCreekUsgs()
  ]);
  const [h, d, c] = results;
  let ok = 0;
  if (h.status === 'fulfilled') { state.hourly = h.value; ok++; }
  else console.warn('hourly failed', h.reason);
  if (d.status === 'fulfilled') { state.daily = d.value; ok++; }
  else console.warn('daily failed', d.reason);
  if (c.status === 'fulfilled') { state.creek = c.value; ok++; }
  else console.warn('creek failed', c.reason);

  if (ok === 0) {
    setBadge('err', 'snapshot (live failed)');
    return;
  }
  state.generated = stampNow();
  render(state);
  if (ok === 3) setBadge('', 'live');
  else setBadge('stale', `live (${ok}/3)`);
}

render(state);
setBadge('stale', location.protocol === 'file:' ? 'snapshot (file://)' : 'snapshot');
setTimeout(refreshLive, 50);
setInterval(refreshLive, 10 * 60 * 1000);

document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'radar') setTimeout(() => radarMap && radarMap.invalidateSize(), 50);
  });
});

let radarMap, radarLayers = [], radarTimer = null, radarIdx = 0, radarFrames = [];
async function startRadar() {
  const status = document.getElementById('radarStatus');
  try {
    radarMap = L.map('radarMap', {
      zoomControl: true, attributionControl: true, minZoom: 4, maxZoom: 10
    }).setView([LAT, LON], 7);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 10
    }).addTo(radarMap);
    L.circleMarker([LAT, LON], {
      radius: 6, color: '#3dffa8', fillColor: '#3dffa8', fillOpacity: 0.9, weight: 2
    }).addTo(radarMap).bindTooltip('Manhattan');

    const data = await fetchJson('https://api.rainviewer.com/public/weather-maps.json');
    const host = data.host;
    const past = data.radar.past || [];
    const nowcast = data.radar.nowcast || [];
    radarFrames = past.concat(nowcast);
    if (!radarFrames.length) { status.textContent = 'no radar frames'; return; }

    radarFrames.forEach((f) => {
      const layer = L.tileLayer(host + f.path + '/256/{z}/{x}/{y}/2/1_1.png', {
        opacity: 0, zIndex: 10, maxNativeZoom: 7, maxZoom: 10, tileSize: 256
      });
      layer.addTo(radarMap);
      radarLayers.push(layer);
    });

    function show(i) {
      radarLayers.forEach((layer, j) => layer.setOpacity(j === i ? 0.75 : 0));
      const ts = new Date(radarFrames[i].time * 1000);
      document.getElementById('radarTime').textContent = ts.toLocaleString('en-US', {
        timeZone: 'America/Chicago', weekday: 'short', hour: 'numeric', minute: '2-digit'
      });
      status.textContent = i >= past.length ? 'nowcast' : 'observed';
    }
    radarIdx = Math.max(0, past.length - 1);
    show(radarIdx);
    radarTimer = setInterval(() => {
      radarIdx = (radarIdx + 1) % radarFrames.length;
      show(radarIdx);
    }, 450);
  } catch (e) {
    status.textContent = 'radar failed to load';
    console.error(e);
  }
}
startRadar();
